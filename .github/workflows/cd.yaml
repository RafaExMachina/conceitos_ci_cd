name: CD - Build, Push and Deploy

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    name: Build, Push e AWS OIDC
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      id-token: write

    outputs:
      image_name: ${{ steps.image.outputs.image_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Converter nome da imagem para minúsculo
        id: image
        shell: bash
        run: |
          IMAGE_NAME="${GITHUB_REPOSITORY,,}"

          echo "IMAGE_NAME=${IMAGE_NAME}" >> "$GITHUB_ENV"
          echo "image_name=${IMAGE_NAME}" >> "$GITHUB_OUTPUT"

      - name: Autenticar na AWS com OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: us-east-1
          role-to-assume: arn:aws:iam::977419190406:role/OIDCGithubActionsRole
          role-session-name: GitHubActions-${{ github.run_id }}

      - name: Validar identidade AWS
        shell: bash
        run: |
          echo "Testando conexão com a AWS..."
          aws sts get-caller-identity

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

  deploy-production:
    name: Deploy em produção
    needs: build-and-push
    runs-on: ubuntu-latest

    permissions:
      contents: read

    environment:
      name: production
      url: https://fiap.com.br

    env:
      IMAGE_NAME: ${{ needs.build-and-push.outputs.image_name }}
      MODEL_TAG: ${{ github.sha }}
      API_ENV: production
      LOG_LEVEL: WARNING

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verificar manifesto Kubernetes
        shell: bash
        run: |
          test -f k8s/deployment.yaml || {
            echo "ERRO: k8s/deployment.yaml não foi encontrado."
            exit 1
          }

      - name: Atualizar imagem do deployment Kubernetes
        shell: bash
        run: |
          set -euo pipefail

          sed -i \
            "s|image: nginx:.*|image: ${REGISTRY}/${IMAGE_NAME}:${MODEL_TAG}|" \
            k8s/deployment.yaml

          sed -i \
            "s|API_ENV_PLACEHOLDER|${API_ENV}|g" \
            k8s/deployment.yaml

          sed -i \
            "s|LOG_LEVEL_PLACEHOLDER|${LOG_LEVEL}|g" \
            k8s/deployment.yaml

      - name: Deploy - Production
        shell: bash
        run: |
          echo "Arquivo YAML atualizado que será enviado para a nuvem:"
          echo

          cat k8s/deployment.yaml

          echo
          echo "Imagem configurada:"
          echo "${REGISTRY}/${IMAGE_NAME}:${MODEL_TAG}"

          echo
          echo "Simulação de deploy executada com sucesso."