name: CD - Build and Push Docker Image

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Converter nome da imagem para minúsculo
        shell: bash
        run: |
          echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Diagnosticar claims do token OIDC
        shell: bash
        run: |
          set -euo pipefail

          RESPONSE=$(curl --silent --show-error \
            --header "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")

          TOKEN=$(echo "$RESPONSE" | python -c \
            'import json, sys; print(json.load(sys.stdin)["value"])')

          export TOKEN

          python - <<'PY'
          import base64
          import json
          import os

          token = os.environ["TOKEN"]

          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)

          claims = json.loads(
              base64.urlsafe_b64decode(payload).decode()
          )

          campos = [
              "iss",
              "aud",
              "sub",
              "repository",
              "repository_id",
              "repository_owner",
              "repository_owner_id",
              "ref",
          ]

          for campo in campos:
              print(f"{campo}: {claims.get(campo)}")
          PY

      - name: AWS Auth (OIDC)
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          aws-region: us-east-1
          role-to-assume: arn:aws:iam::977419190406:role/OIDCGithubActionsRole
          role-session-name: GitHubActions-${{ github.run_id }}

      - name: Validar identidade AWS
        run: |
          echo "Testando conexão com a AWS..."
          aws sts get-caller-identity